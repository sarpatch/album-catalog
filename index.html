<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; connect-src 'self' https://api.dropboxapi.com https://content.dropboxapi.com https://www.googleapis.com https://accounts.google.com; frame-src https://accounts.google.com; img-src 'self' blob: data:; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="no-referrer">
  <title>Levyhylly – LP-kokoelma</title>
  <meta name="description" content="LP-levykokoelman hallinta: haku, kansikuvat, kuntoluokitus ja synkronointi Dropboxiin tai Google Driveen.">
  <meta name="theme-color" content="#f6f5f2">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Levyhylly">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
  <script src="js/boot.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <a class="skip" href="#collection">Siirry kokoelmaan</a>

  <header class="topbar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="15"/><circle class="logo-label" cx="16" cy="16" r="5.5"/><circle class="logo-hole" cx="16" cy="16" r="1.3"/></svg>
      <div>
        <h1>Levyhylly</h1>
        <p id="count" aria-live="polite"></p>
      </div>
    </div>

    <label class="search">
      <span class="visually-hidden">Hae levyjä</span>
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM21 21l-4.3-4.3"/></svg>
      <input id="search" type="search" placeholder="Hae artistia, levyä, yhtiötä…" autocomplete="off" enterkeyhint="search">
      <kbd class="desktop-only">/</kbd>
    </label>

    <div class="top-actions">
      <button id="sync-status" class="chip" type="button" data-state="local"></button>
      <button id="btn-stats" class="icon-btn" type="button" aria-label="Tilastot" title="Tilastot">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
      </button>
      <button id="btn-theme" class="icon-btn" type="button" aria-label="Teema" title="Vaihda teemaa">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18c1 0 1.5-.8 1.5-1.5 0-.4-.2-.8-.4-1.1-.3-.3-.4-.6-.4-1 0-.8.7-1.4 1.5-1.4H16a5 5 0 0 0 5-5c0-4.4-4-8-9-8zM7.5 11.5h.01M10.5 7.5h.01M15.5 7.5h.01"/></svg>
      </button>
      <button id="btn-settings" class="icon-btn" type="button" aria-label="Asetukset" title="Asetukset">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6zM19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
      <button id="add" class="btn btn-primary desktop-only" type="button">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Lisää levy
      </button>
    </div>
  </header>

  <div class="toolbar">
    <button id="filter-toggle" class="btn btn-small" type="button">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18l-7 8v6l-4-2v-4z"/></svg>Suodata
    </button>
    <div class="sort-group">
      <label class="sort"><span class="visually-hidden">Järjestä</span><select id="sort"></select></label>
      <button id="sort-dir" class="icon-btn" type="button" aria-label="Järjestyksen suunta"></button>
    </div>
    <button id="btn-columns" class="btn btn-small" type="button" hidden>
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v16H4zM9.5 4v16M14.5 4v16"/></svg><span class="lbl">Sarakkeet</span>
    </button>
    <div class="view-toggle" role="group" aria-label="Näkymä">
      <button type="button" class="icon-btn" data-view="grid" aria-label="Kansinäkymä" title="Kansinäkymä">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/></svg>
      </button>
      <button type="button" class="icon-btn" data-view="table" aria-label="Taulukko" title="Taulukko (muokattava)">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18v14H3zM3 10h18M3 15h18M9 5v14"/></svg>
      </button>
    </div>
  </div>
  <div id="chips" class="chips" hidden></div>

  <div id="banner" class="banner" hidden></div>

  <main id="collection" class="grid" tabindex="-1" aria-label="Levykokoelma"></main>

  <button id="fab" class="fab mobile-only" type="button" aria-label="Lisää levy">
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <noscript><p class="noscript">Levyhylly tarvitsee JavaScriptin toimiakseen.</p></noscript>
</body>
</html>
